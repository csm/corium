name: Java native jars

on:
  workflow_call:
    inputs:
      release_ref:
        description: Version tag to build
        required: true
        type: string
  pull_request:
    paths:
      # The engine library statically links the whole peer stack, so any crate
      # can break these jars. Naming a subset would let a change to, say,
      # corium-db land without ever building them.
      - ".github/workflows/java-native.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "clients/java/**"
      - "crates/**"

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - if: inputs.release_ref != ''
        run: >-
          python clients/java/scripts/release.py check
          --expected "${{ inputs.release_ref }}"
      - if: inputs.release_ref == ''
        run: python clients/java/scripts/release.py check

  # The manylinux containers keep the Linux libraries loadable on
  # distributions older than the runner image, matching the Python wheels.
  linux:
    needs: release-check
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_x86_64
            classifier: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: quay.io/pypa/manylinux_2_28_aarch64
            classifier: linux-aarch64
    runs-on: ${{ matrix.platform.runner }}
    container:
      image: ${{ matrix.platform.container }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine and storage plugin libraries
        run: >-
          cargo build --release --locked
          --target ${{ matrix.platform.target }}
          -p corium-jni
          -p corium-store-turso
          -p corium-store-postgres
          -p corium-store-s3
      - name: Build platform jars
        run: >-
          /opt/python/cp310-cp310/bin/python
          clients/java/scripts/build_native_jars.py
          --target-directory target/${{ matrix.platform.target }}/release
          --classifier ${{ matrix.platform.classifier }}
          --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.platform.classifier }}
          path: dist/*.jar
          if-no-files-found: error

  native:
    needs: release-check
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15
            target: aarch64-apple-darwin
            classifier: macos-aarch64
            deployment_target: "11.0"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            classifier: macos-x86_64
            deployment_target: "10.12"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            classifier: windows-x86_64
            deployment_target: ""
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the engine and storage plugin libraries
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment_target }}
        run: >-
          cargo build --release --locked
          --target ${{ matrix.platform.target }}
          -p corium-jni
          -p corium-store-turso
          -p corium-store-postgres
          -p corium-store-s3
      - name: Build platform jars
        run: >-
          python clients/java/scripts/build_native_jars.py
          --target-directory target/${{ matrix.platform.target }}/release
          --classifier ${{ matrix.platform.classifier }}
          --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: java-native-${{ matrix.platform.classifier }}
          path: dist/*.jar
          if-no-files-found: error

  smoke:
    needs: [linux, native]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            classifier: linux-x86_64
          - runner: ubuntu-24.04-arm
            classifier: linux-aarch64
          - runner: macos-15
            classifier: macos-aarch64
          - runner: macos-15-intel
            classifier: macos-x86_64
          - runner: windows-2025
            classifier: windows-x86_64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      - uses: actions/download-artifact@v4
        with:
          name: java-native-${{ matrix.platform.classifier }}
          path: dist
      # Loads the engine out of the jar this platform would publish, so a jar
      # the client cannot load fails here rather than after publication.
      #
      # The property arguments are quoted because PowerShell, the default shell
      # on the Windows runner, otherwise splits them at the drive-letter colon
      # in the workspace path and Maven reads the remainder as a goal.
      - name: Load the platform jar
        run: >-
          mvn -f clients/java/pom.xml --batch-mode
          --projects client
          --activate-profiles native-test
          "-Dcorium.native.jars=${{ github.workspace }}/dist"
          "-Dcorium.native.classifier=${{ matrix.platform.classifier }}"
          -Dtest=NativeArtifactTest
          test
