name: publish.yml
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

env:
  CARGO_TERM_COLOR: always
  BASE_VERSION: "0.1"

jobs:
  ci:
    name: "Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # GC-mode cljrs crates build standalone so they keep GC mode (see ci.yml).
      - run: cargo clippy --workspace --exclude corium-cljrs --exclude corium-mbrainz --all-targets -- -D warnings
      - run: ./scripts/test-rust.sh
      - run: cargo clippy -p corium-cljrs -p corium-mbrainz --all-targets -- -D warnings

  clojure-ci:
    name: "Build & Test Clojure client"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: clients/clojure/deps.edn
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - working-directory: clients/clojure
        run: clojure -M:test
      - working-directory: clients/clojure
        run: clojure -T:build jar
      - run: python3 clients/clojure/scripts/release.py check

  publish:
    name: "Publish to crates.io"
    runs-on: ubuntu-latest
    needs: [ci, clojure-ci]
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Set crate versions
        id: release
        run: |
          VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "Publishing version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "release_ref=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cargo release version "$VERSION" --execute --no-confirm
          python3 clients/python/scripts/release.py set "$VERSION"
          python3 clients/java/scripts/release.py set "$VERSION"
          python3 clients/clojure/scripts/release.py set "$VERSION"
          echo "--- Workspace Cargo.toml ---"
          cat Cargo.toml
          echo ""
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          # Always commit the version bump so cargo publish sees a clean tree.
          # On a fresh re-run the files are re-edited from 0.1.0, so there will
          # always be staged changes to commit.
          git diff --cached --quiet || git commit -m "chore: release $VERSION"
          # Only create and push the tag if it doesn't already exist on the remote,
          # making retries safe after a partial publish failure.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists on remote — skipping tag push"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Build --exclude list for packages already live at this version.
          # Makes the step idempotent so a retry after a partial failure is safe.
          EXCLUDE=()
          while IFS= read -r pkg; do
            name="${pkg%%@*}"
            ver="${pkg##*@}"
            if curl -sf "https://crates.io/api/v1/crates/${name}/${ver}" \
                 -H "User-Agent: corium-publish/1.0" | grep -q '"num"'; then
              echo "Already published: ${name}@${ver} — skipping"
              EXCLUDE+=(--exclude "${name}")
            fi
          done < <(cargo metadata --no-deps --format-version 1 \
                     | jq -r '.packages[] | "\(.name)@\(.version)"')

          cargo publish --workspace \
            --no-verify \
            "${EXCLUDE[@]}"

  java-native:
    name: "Build Java native jars"
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/java-native.yml
    with:
      release_ref: ${{ needs.publish.outputs.release_ref }}

  java-publish:
    name: "Publish Java client to Maven Central"
    runs-on: ubuntu-latest
    needs: [publish, java-native]
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/dev.corium/corium-client/${{ needs.publish.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.release_ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: java-native-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/pom.xml
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: >-
          mvn -f clients/java/pom.xml --batch-mode
          --activate-profiles release,native
          -Dcorium.native.jars=${{ github.workspace }}/dist
          deploy
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  clojure-publish:
    name: "Publish Clojure client to Clojars"
    needs: [publish, java-publish]
    uses: ./.github/workflows/publish-clojure.yml
    with:
      release_ref: ${{ needs.publish.outputs.release_ref }}
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit

  python-wheels:
    name: "Build Python wheels"
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/python-wheels.yml
    with:
      release_ref: ${{ needs.publish.outputs.release_ref }}

  python-publish:
    name: "Publish ${{ matrix.distribution.name }} to PyPI"
    needs: python-wheels
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - name: corium
            environment: pypi
          - name: corium-postgres
            environment: pypi-postgres
          - name: corium-s3
            environment: pypi-s3
          - name: corium-turso
            environment: pypi-turso
    runs-on: ubuntu-24.04
    environment:
      name: ${{ matrix.distribution.environment }}
      url: https://pypi.org/project/${{ matrix.distribution.name }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*-${{ matrix.distribution.name }}
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
