name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: clients/java/pom.xml
      - run: mvn -f clients/java/pom.xml --batch-mode --activate-profiles release -Dgpg.skip=true verify
      - run: python3 clients/java/scripts/release.py check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml
      - run: python -m pip install -e './clients/python[dev]'
      - run: ruff check clients/python
      - run: ruff format --check clients/python
      - run: mypy --config-file clients/python/pyproject.toml clients/python/src clients/python/tests clients/python/examples clients/python/artifacts
      - run: python -m unittest discover -s clients/python/tests -v
      - run: python clients/python/scripts/release.py check

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: corium_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corium_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      localstack:
        # S3 conditional-write (If-Match/If-None-Match) support landed
        # incrementally in LocalStack; pin to a major known to enforce it,
        # since the fenced-root race tests below depend on real enforcement.
        image: localstack/localstack:4
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: examples/postgres-jdbc/pom.xml
      - run: cargo fmt --all -- --check
      # corium-cljrs and the musicbrainz example are excluded from
      # workspace-wide builds: unified with the cljrs-featured transactor
      # they would compile in no-gc mode. The standalone step below builds
      # them in their intended GC mode.
      - run: cargo clippy --workspace --exclude corium-cljrs --exclude corium-mbrainz --all-targets -- -D warnings
      - run: cargo test --workspace --exclude corium-cljrs --exclude corium-mbrainz
      - name: Lint optional native-client storage backends
        run: cargo clippy -p corium-ffi -p corium-python -p corium-jni --features all-storage --all-targets -- -D warnings
      - name: Test optional Python storage backends
        run: cargo test -p corium-ffi --features all-storage
      - name: Check Python direct-storage artifact isolation
        run: |
          cargo tree -p corium-python --no-default-features -e normal > /tmp/corium-python-base-tree
          if grep -E '(^| )turso v|deadpool-postgres|aws-sdk-s3' /tmp/corium-python-base-tree; then
            echo "base Python artifact unexpectedly includes an optional storage driver"
            exit 1
          fi
          cargo check -p corium-python --no-default-features --features turso
          cargo check -p corium-python --no-default-features --features postgres
          cargo check -p corium-python --no-default-features --features s3
      - name: Test GC-mode cljrs crates (standalone)
        run: |
          cargo clippy -p corium-cljrs -p corium-mbrainz --all-targets -- -D warnings
          cargo test -p corium-cljrs -p corium-mbrainz
      - name: Test PostgreSQL wire protocol with JDBC
        run: examples/postgres-jdbc/run.sh
      - name: Test PostgreSQL store
        env:
          CORIUM_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/corium_test?sslmode=disable
        run: cargo test -p corium-store-postgres --test store
      - name: Test S3 store
        env:
          CORIUM_TEST_S3_BUCKET: corium-test
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://localhost:4566
        run: cargo test -p corium-store-s3 --test store
