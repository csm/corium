[package]
name = "corium-store-turso"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "Turso storage backend and dynamic plugin for Corium"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Suppress the shared ABI loader symbol when this driver is linked into a host.
static-link = []

[dependencies]
abi_stable = "0.11.3"
async-trait = "0.1"
corium-store = { workspace = true }
corium-store-abi = { workspace = true }
corium-store-plugin = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "sync"] }
tokio-stream = "0.1.18"
turso = { version = "0.7.0", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "sync"] }
