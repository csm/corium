[package]
name = "corium-store-postgres"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "PostgreSQL storage backend for Corium"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Suppress the shared ABI loader symbol when this driver is linked into a host.
static-link = []

[dependencies]
abi_stable = "0.11.3"
async-trait = "0.1"
corium-store = { workspace = true }
corium-store-abi = { workspace = true }
corium-store-plugin = { workspace = true }
deadpool-postgres = "0.14.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres-rustls = { version = "0.14.0", features = ["native-certs", "ring"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "sync"] }
tokio-stream = "0.1.18"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
