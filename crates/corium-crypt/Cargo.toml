[package]
name = "corium-crypt"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "Cryptographic primitives and key resolution for Corium"

[features]
# AWS KMS as a key source: `awskms:` identities resolve through Encrypt,
# Decrypt, and GenerateMac instead of a local file.
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms"]
# An in-process key service for tests wiring a keyring end to end.
testing = []

[dependencies]
aes-gcm = "0.10"
aes-gcm-siv = "0.11"
async-trait = "0.1"
aws-config = { version = "1", optional = true }
aws-sdk-kms = { version = "1.99", optional = true }
blake3 = "1"
getrandom = "0.3"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1.53.0", features = ["macros", "rt"] }

[lints]
workspace = true
