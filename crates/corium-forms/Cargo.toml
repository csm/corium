[package]
name = "corium-forms"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "Boundary conversion between schema/transaction forms and engine types"

[dependencies]
corium-core = { workspace = true }
corium-db = { workspace = true }
corium-query = { workspace = true }
corium-tx = { workspace = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2"
toml = { version = "1.1.2", optional = true }

[features]
default = ["toml"]
toml = ["dep:serde", "dep:toml"]

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
