[package]
name = "corium-peer"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "Corium peer library"

[dependencies]
async-trait = "0.1"
corium-authz = { workspace = true }
corium-core = { workspace = true }
corium-crypt = { workspace = true }
corium-db = { workspace = true }
corium-forms = { workspace = true }
corium-log = { workspace = true }
corium-protocol = { workspace = true }
corium-query = { workspace = true }
corium-store = { workspace = true }
getrandom = "0.3"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1.18"
tonic = { version = "0.14.5", features = ["tls-ring"] }

[dev-dependencies]
corium-transactor = { workspace = true }
tempfile = "3"

[lints]
workspace = true
