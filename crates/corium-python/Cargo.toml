[package]
name = "corium-python"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "PyO3 adapter for the Corium native client"
publish = false

[lib]
name = "_corium"
crate-type = ["cdylib", "rlib"]

[dependencies]
corium-core = { workspace = true }
corium-ffi = { workspace = true }
corium-protocol = { workspace = true }
corium-query = { workspace = true }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }

[lints]
workspace = true
