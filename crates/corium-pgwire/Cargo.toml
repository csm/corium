[package]
name = "corium-pgwire"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "PostgreSQL wire-protocol front end for Corium SQL"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
corium-core = { workspace = true }
corium-db = { workspace = true }
corium-query = { workspace = true }
corium-sql = { workspace = true }
thiserror = "2"
tokio = { version = "1.53.0", features = [
    "rt",
    "net",
    "io-util",
    "macros",
    "sync",
    "time",
] }
tracing = "0.1"

[dev-dependencies]
corium-forms = { workspace = true }
corium-tx = { workspace = true }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
