[package]
name = "corium-store-s3"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
description = "S3 storage backend for Corium"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
abi_stable = "0.11.3"
async-trait = "0.1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
corium-store = { workspace = true }
corium-store-abi = { workspace = true }
corium-store-plugin = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "sync"] }
tokio-stream = "0.1.18"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
