[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "corium"
version = "0.1.65"
description = "Async local and remote Python client for Corium"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0 OR MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
keywords = ["database", "datalog", "asyncio"]

[project.urls]
Documentation = "https://github.com/csm/corium/tree/main/clients/python"
Issues = "https://github.com/csm/corium/issues"
Repository = "https://github.com/csm/corium"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.maturin]
manifest-path = "../../crates/corium-python/Cargo.toml"
module-name = "corium._corium"
python-source = "src"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
