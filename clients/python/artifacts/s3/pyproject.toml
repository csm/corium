[project]
name = "corium-s3"
version = "0.1.85"
description = "S3 direct-storage plugin for the Corium Python client"
requires-python = ">=3.10"
dependencies = ["corium==0.1.85"]
license = { text = "Apache-2.0 OR MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://github.com/csm/corium/tree/main/clients/python"
Issues = "https://github.com/csm/corium/issues"
Repository = "https://github.com/csm/corium"

[project.entry-points."corium.store_plugins"]
s3 = "corium_s3:plugin_path"
