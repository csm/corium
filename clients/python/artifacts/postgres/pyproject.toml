[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "corium-postgres"
version = "0.1.64"
description = "Corium Python client with PostgreSQL direct-storage support"
requires-python = ">=3.10"
dependencies = ["corium==0.1.64"]
license = { text = "Apache-2.0 OR MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[tool.maturin]
manifest-path = "../../../../crates/corium-python/Cargo.toml"
module-name = "corium._corium_postgres"
python-source = "python"
features = ["artifact-postgres"]
